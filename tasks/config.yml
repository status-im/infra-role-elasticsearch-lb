---
- name: Adjust vm.max_map_count
  sysctl:
    name:   'vm.max_map_count'
    value:  '{{ es_lb_max_map_count | string }}'
    state:  'present'
    reload: true

- name: 'Create folders for: {{ es_lb_cont_name }}'
  file:
    path:    '{{ es_lb_host_config_path }}'
    owner:   '{{ es_lb_host_uid }}'
    group:   'docker'
    state:   'directory'
    mode:    '0o750'
    recurse: true

- name: Create directory for config files
  file:
    path:  '{{ es_lb_host_config_path }}/ingest-geoip'
    owner: '{{ es_lb_host_uid }}'
    group: 'docker'
    mode:  '0o640'
    state: 'directory'

- name: Create config files
  template:
    src:   '{{ item }}'
    dest:  '{{ es_lb_host_config_path }}/{{ item | basename | replace(".j2", "") }}'
    owner: '{{ es_lb_host_uid }}'
    group: 'docker'
    mode:  '0o640'
  register: es_lb_config
  with_fileglob:
    - templates/config/*
