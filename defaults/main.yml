---
es_lb_service_name: 'elasticsearch-lb'
es_lb_service_path: '/docker/{{ es_lb_service_name }}'
es_lb_compose_path: '{{ es_lb_service_path }}/docker-compose.yml'

# Mandatory variables
es_lb_cluster_name: ~
es_lb_master_nodes: ~

# Docker
es_lb_docker_network_name: '{{ es_lb_service_name }}'
# Node
es_lb_cont_name: '{{ es_lb_service_name }}'
es_lb_cont_vol: '{{ es_lb_service_path }}/node'
es_lb_cont_tag: '7.17.28'
es_lb_cont_image: 'elasticsearch:{{ es_lb_cont_tag }}'
es_lb_cont_uid: 1000
es_lb_host_uid: '{{ 100000 + es_lb_cont_uid | int }}'
es_lb_host_config_path: '{{ es_lb_cont_vol }}/conf'

# Ports
es_lb_api_port: 9200
es_lb_node_port: 9300

# Authentication
es_lb_security_enabled: false
es_lb_transport_certs_path: '{{ es_lb_host_config_path }}/certs'
es_lb_transport_pem_path: '{{ es_lb_transport_certs_path }}/{{ hostname }}.pem'
es_lb_transport_key_path: '{{ es_lb_transport_certs_path }}/{{ hostname }}.key'
es_lb_transport_ca_pem_path: '{{ es_lb_transport_certs_path }}/ca.pem'

es_lb_consul_tags:
  - '{{ env }}.{{ stage }}'
  - '{{ es_lb_cluster_name }}'

es_lb_data_center: do-ams3
es_lb_listen_addr: '0.0.0.0'

es_lb_max_map_count: 262144
es_lb_jvm_g1gc_enabled: false
es_lb_jvm_heap_auto: true
#es_lb_jvm_min_heap: 2g
#es_lb_jvm_max_heap: 2g

# general container management
compose_recreate: 'auto'
compose_state: 'present'
compose_pull: 'always'
